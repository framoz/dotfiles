################
### MONITORS ###
################


# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,1

# 4K monitor stacked above the laptop screen, horizontally centered over it.
# Positions are in *logical* pixels (post-scale):
#   HDMI-A-1 logical 3072x1728 at (0, 0)      (3840x2160 / 1.25)
#   eDP-1    logical 1920x1200 at (576, 1728) (centered: (3072-1920)/2)
monitor=HDMI-A-1,3840x2160@120,0x0,1.25
monitor=eDP-1,1920x1200@60,576x1728,1

#unscale Wayland
xwayland{
 force_zero_scaling = true
}
