# ── Blade Runner Hyprlock ──

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 3
}

animations {
    enabled = false
}

# ── Background ──

background {
    monitor =
    path = ~/Images/ChukchiSea-bladerunner.jpg
    blur_passes = 0
    brightness = 0.35
}

# ── Time ──

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font:style=Bold
    color = rgba(d4c5a0ff)

    position = 0, 200
    halign = center
    valign = center
}

# ── Date ──

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font:style=Bold
    color = rgba(d4c5a0ff)

    position = 0, 120
    halign = center
    valign = center
}

# ── Greeting ──

label {
    monitor =
    text = Hi, $USER
    font_size = 14
    font_family = $font:style=Bold
    color = rgba(ff8c42ff)

    position = 0, 40
    halign = center
    valign = center
}

# ── Input field ──

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    inner_color = rgba(0d1117ff)
    rounding = 0

    outer_color = rgba(ff8c42ff)
    check_color = rgba(6cc4d4ff)
    fail_color = rgba(e85d5dff)
    capslock_color = rgba(e6b450ff)

    font_color = rgba(d4c5a0ff)
    fade_on_empty = false

    font_family = $font:style=Bold
    placeholder_text = Enter password
    fail_text = $PAMFAIL

    dots_spacing = 0.3
    dots_size = 0.25
    dots_rounding = -1
    dots_center = true

    position = 0, -30
    halign = center
    valign = center
}

# ── Keyboard layout ──

label {
    monitor =
    text = $LAYOUT[pt,ru]
    font_size = 12
    font_family = $font:style=Bold
    color = rgba(4a4f5aff)
    onclick = hyprctl switchxkblayout all next

    position = 0, -80
    halign = center
    valign = center
}
