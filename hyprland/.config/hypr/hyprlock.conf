# ── Tokyonight Hyprlock ──

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 3
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, linear
}

# ── Background ──

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.15
}

# ── Time ──

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgba(c0caf5ff)

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(1a1b26cc)

    position = 0, 200
    halign = center
    valign = center
}

# ── Date ──

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = rgba(565f89ff)

    position = 0, 120
    halign = center
    valign = center
}

# ── Greeting ──

label {
    monitor =
    text = Hi, $USER
    font_size = 14
    font_family = $font
    color = rgba(7aa2f7ff)

    position = 0, 40
    halign = center
    valign = center
}

# ── Input field ──

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    inner_color = rgba(1a1b2688)
    rounding = 12

    outer_color = rgba(7aa2f7cc)
    check_color = rgba(9ece6acc)
    fail_color = rgba(f7768ecc)
    capslock_color = rgba(e0af68cc)

    font_color = rgba(c0caf5ff)
    fade_on_empty = false

    font_family = $font
    placeholder_text =   Enter password...
    fail_text =   $PAMFAIL

    dots_spacing = 0.25
    dots_size = 0.3
    dots_rounding = -1

    position = 0, -30
    halign = center
    valign = center
}

# ── Keyboard layout ──

label {
    monitor =
    text = $LAYOUT[pt,ru]
    font_size = 12
    font_family = $font
    color = rgba(565f89ff)
    onclick = hyprctl switchxkblayout all next

    position = 0, -80
    halign = center
    valign = center
}
