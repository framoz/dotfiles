# ── Tokyonight Tmux ──

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000

# ── Status bar ──

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"

# Left
set -g status-left-length 30
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1a1b26] "

# Right
set -g status-right-length 50
set -g status-right "#[fg=#565f89]%H:%M #[fg=#24283b]│ #[fg=#565f89]%b %d "

# Windows
set -g window-status-format "#[fg=#565f89]  #I:#W "
set -g window-status-current-format "#[fg=#7aa2f7,bold]  #I:#W "
set -g window-status-separator ""

# ── Panes ──

set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#7aa2f7"

# ── Messages ──

set -g message-style "bg=#24283b,fg=#c0caf5"
set -g message-command-style "bg=#24283b,fg=#c0caf5"

# ── Splits ──

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload
bind r source-file ~/.tmux.conf \; display "Reloaded"
