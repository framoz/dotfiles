# ── Blade Runner Tmux ──

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 10000

# ── Status bar ──

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0d1117,fg=#d4c5a0"

# Left
set -g status-left-length 30
set -g status-left "#[fg=#0d1117,bg=#ff8c42,bold]  #S #[fg=#ff8c42,bg=#0d1117] "

# Right
set -g status-right-length 50
set -g status-right "#[fg=#d4c5a0]%H:%M #[fg=#4a4f5a]│ #[fg=#4a4f5a]%b %d "

# Windows
set -g window-status-format "#[fg=#4a4f5a]  #I:#W "
set -g window-status-current-format "#[fg=#ff8c42,bold]  #I:#W "
set -g window-status-separator ""

# ── Panes ──

set -g pane-border-style "fg=#4a4f5a"
set -g pane-active-border-style "fg=#ff8c42"

# ── Messages ──

set -g message-style "bg=#ff8c42,fg=#0d1117,bold"
set -g message-command-style "bg=#ff8c42,fg=#0d1117,bold"

# ── Splits ──

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload
bind r source-file ~/.tmux.conf \; display "Reloaded"
