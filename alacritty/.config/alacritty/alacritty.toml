# ── Brutalist Alacritty ──

[window]
opacity = 1.0
blur = false
padding = { x = 8, y = 6 }
decorations = "None"
dynamic_padding = false

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# ── Brutalist grayscale palette ──
# No hues — only luminance. Colors typically used as panel backgrounds
# (red/blue/magenta) are dark so white text stays readable; colors
# typically used as foreground (green/yellow/cyan) are light so they
# stay readable on black. Lets TUI apps (nmtui, dialog, whiptail) paint
# legible panels and highlights.

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.cursor]
text   = "#000000"
cursor = "#ffffff"

[colors.selection]
text       = "#000000"
background = "#ffffff"

[colors.normal]
black   = "#000000"
red     = "#333333"
green   = "#bbbbbb"
yellow  = "#cccccc"
blue    = "#222222"
magenta = "#666666"
cyan    = "#aaaaaa"
white   = "#ffffff"

[colors.bright]
black   = "#555555"
red     = "#555555"
green   = "#dddddd"
yellow  = "#eeeeee"
blue    = "#444444"
magenta = "#888888"
cyan    = "#cccccc"
white   = "#ffffff"

[cursor.style]
shape = "Block"
blinking = "Off"
